@if (isCustom) {
  <ng-content></ng-content>
}
@if (!isCustom) {
  <div class="form-group">
    <a (click)="clearSearchTerm(true)" class="search-clear">
      <i class="fa fa-times fa-1x"></i>
    </a>
    <input #inputSearchRef
      type="text"
      [ngClass]="classes"
      [placeholder]="placeholder"
      [formControl]="searchInputControl" />
    </div>
  }
