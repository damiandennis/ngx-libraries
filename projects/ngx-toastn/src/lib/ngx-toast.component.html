<div class="toast" [ngClass]="[toast.type, toast.theme]">
  @if (toast.showClose) {
    <div class="close-button" (click)="close($event)"></div>
  }
  @if (toast.title || toast.msg) {
    <div class="toast-text">
      @if (toast.title) {
        <span class="toast-title" [innerHTML]="toast.title | safeHtml"></span>
      }
      @if (toast.title && toast.msg) {
        <br />
      }
      @if (toast.msg) {
        <span class="toast-msg" [innerHtml]="toast.msg | safeHtml"></span>
      }
    </div>
  }
</div>
